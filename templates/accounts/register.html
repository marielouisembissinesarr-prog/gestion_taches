{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 bg-white p-4 mt-3">
            <div class="card-body">
                <h2 class="h4 fw-bold text-center text-dark mb-4">Créer un compte collaborateur</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-3">
                        S'inscrire gratuitement
                    </button>
                </form>
                
                <hr class="my-4 text-muted">
                <p class="text-center small text-secondary mb-0">
                    Déjà membre ? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
