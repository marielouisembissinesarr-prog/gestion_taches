

{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 bg-white p-4">
            <div class="card-body">
                <h2 class="h4 fw-bold text-center text-dark mb-4">Créer un compte</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label small fw-bold text-secondary">
                                {{ field.label }}
                            </label>
                            
                            {{ field }}
                            
                            {% for error in field.errors %}
                                <div class="text-danger small mt-1 fw-semibold">
                                    {{ error }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3">
                        S'inscrire
                    </button>
                </form>
                
                <hr class="my-4 text-muted">
                <p class="text-center small text-secondary mb-0">
                    Déjà membre ? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
