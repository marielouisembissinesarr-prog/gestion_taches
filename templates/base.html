<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme de Gestion de Tâches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">📊 GestionTâches</a>
            <div class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <!-- Options affichées si l'utilisateur est connecté -->
                    <span class="navbar-text me-3 text-light small">Bonjour, <strong>{{ user.username }}</strong></span>
                    <a class="nav-link me-3" href="/">Tableau de bord</a>
                    
                    <!-- Formulaire POST sécurisé pour la déconnexion -->
                    <form method="POST" action="{% url 'logout' %}" class="d-inline m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm fw-bold">
                            Déconnexion
                        </button>
                    </form>
                {% else %}
                    <!-- Options affichées si l'utilisateur est un visiteur -->
                    <a class="nav-link" href="{% url 'login' %}">Connexion</a>
                    <a class="nav-link" href="{% url 'register' %}">Inscription</a>
                {% endif %}
            </div>
        </div>
    </nav>

<!-- Affichage des messages flash -->
{% if messages %}
  <div class="container mt-3">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}



    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
